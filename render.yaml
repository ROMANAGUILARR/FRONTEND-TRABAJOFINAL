# render.yaml — Frontend EcoSolido (Static Site en Render.com)
# Puedes crear el servicio desde el dashboard de Render sin este archivo:
#   Build Command:  npm install && npm run build
#   Publish Directory: dist
#   Environment Variable: VITE_API_URL = https://backend-trabajofinal.onrender.com
services:
  - type: web
    name: ecosolido-frontend
    runtime: static
    repo: https://github.com/ROMANAGUILARR/FRONTEND-TRABAJOFINAL
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false   # https://backend-trabajofinal.onrender.com
