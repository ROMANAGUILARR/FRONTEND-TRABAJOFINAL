name: CI/CD - Pruebas y Deploy a Vercel

# Se ejecuta con cada cambio en la rama main (y se puede lanzar a mano desde la pestaña Actions).
# En un pull request hacia main solo corre las pruebas y la compilación, sin desplegar.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga el código del repositorio
      - name: Descargar código
        uses: actions/checkout@v4

      # 2. Instala Node.js 22 y guarda en caché las dependencias de npm
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # 3. Instala las dependencias exactas del package-lock.json
      - name: Instalar dependencias
        run: npm ci

      # 4. Ejecuta las pruebas automatizadas (validaciones del registro y vencimiento de la sesión)
      - name: Ejecutar pruebas
        run: npm test

      # 5. Compila la aplicación; si hay un error de código, el flujo se detiene y no se despliega
      - name: Compilar aplicación
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: test # Solo corre si las pruebas y la compilación pasan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Preparar despliegue
        run: echo "Pruebas aprobadas. Iniciando despliegue hacia Vercel..."

      # Llama al Deploy Hook de Vercel, guardado como secreto en GitHub (nunca en el código)
      - name: Desplegar en Vercel
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "Falta el secreto VERCEL_DEPLOY_HOOK en Settings > Secrets and variables > Actions"
            exit 1
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
          echo "Despliegue solicitado a Vercel."
